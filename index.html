
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Urdu AI Voice</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f7ff;margin:0;padding:20px}
.box{max-width:600px;margin:30px auto;background:white;padding:25px;border-radius:20px;box-shadow:0 4px 15px #ccc}
h1{text-align:center;color:#2457a6}
textarea{width:100%;height:180px;font-size:18px;padding:12px;box-sizing:border-box;border-radius:12px;border:1px solid #aaa}
button{width:100%;padding:14px;margin-top:15px;border:0;border-radius:12px;background:#2457a6;color:white;font-size:18px}
button:hover{background:#174080}
p{text-align:center;color:#666}
</style>
</head>
<body>
<div class="box">
<h1>🎙️ My Urdu AI Voice</h1>
<p>اپنا اردو متن یہاں لکھیں</p>
<textarea id="text" placeholder="یہاں اردو لکھیں..."></textarea>
<button onclick="speak()">🔊 اردو آواز سنیں</button>
</div>

<script>
function speak(){
let text=document.getElementById("text").value;
if(!text){alert("براہِ کرم پہلے اردو متن لکھیں");return;}
let voice=new SpeechSynthesisUtterance(text);
voice.lang="ur-PK";
speechSynthesis.cancel();
speechSynthesis.speak(voice);
}
</script src="script.js"></script>
</body>
</html>
