<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Urdu AI Voice</title>
</head>

<body>
  <h2>🎙️ My Urdu AI Voice</h2>

  <textarea id="text" rows="8" cols="35"
    placeholder="Yahan Urdu text likhein..."></textarea>

  <br><br>

  <button id="speakBtn">🔊 Voice Banayein</button>

  <script>
    document.getElementById("speakBtn").addEventListener("click", function () {
      const text = document.getElementById("text").value.trim();

      if (!text) {
        alert("Pehle text likhein");
        return;
      }

      window.speechSynthesis.cancel();

      const voice = new SpeechSynthesisUtterance(text);
      voice.lang = "ur-PK";
      voice.rate = 0.9;
      voice.pitch = 1;
      voice.volume = 1;

      window.speechSynthesis.speak(voice);
    });
  </script>
</body>
</html>
